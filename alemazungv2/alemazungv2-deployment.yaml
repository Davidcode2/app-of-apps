apiVersion: apps/v1
kind: Deployment
metadata:
  name: alemazungv2
  namespace: joy-alemazung
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alemazungv2
  template:
    metadata:
      labels:
        app: alemazungv2
    spec:
      containers:
        - name: alemazungv2
          image: ghcr.io/davidcode2/alemazung_astro:0.0.3
          envFrom:
            - secretRef:
                name: alemazung-strapi-secret
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
