apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: alemazung-ingress
  namespace: joy-alemazung
  annotations:
    # Apply after the Astro service.
    argocd.argoproj.io/sync-wave: "1"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  # This tells the NGINX controller to manage this Ingress
  ingressClassName: nginx
  rules:
    - host: "alemazung.jakob-lingel.dev"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: alemazungv2
                port:
                  # This must match the 'port' (not targetPort) from the Service
                  number: 80
    - host: "alemazung.de"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: alemazungv2
                port:
                  number: 80
    - host: "www.alemazung.de"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: alemazungv2
                port:
                  # This must match the 'port' (not targetPort) from the Service
                  number: 80
  tls:
  - hosts:
      - "alemazung.jakob-lingel.dev"
      - "alemazung.de"
      - "www.alemazung.de"
    secretName: alemazung-tls
