apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: teachme-keycloak-ingress
  namespace: teachme
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # Keycloak requires specific proxy settings
    nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
spec:
  ingressClassName: nginx
  rules:
    - host: auth.jakob-lingel.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: teachme-keycloak-service
                port:
                  number: 8080
  tls:
    - hosts:
        - auth.jakob-lingel.dev
      secretName: teachme-keycloak-tls
