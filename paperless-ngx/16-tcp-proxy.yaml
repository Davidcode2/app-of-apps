apiVersion: v1
kind: ConfigMap
metadata:
  name: paperless-proxy-config
  namespace: paperless-ngx
  annotations:
    argocd.argoproj.io/sync-wave: "2"
data:
  nginx.conf: |
    user nginx;
    worker_processes auto;
    error_log /var/log/nginx/error.log warn;
    pid /var/run/nginx.pid;

    events {
        worker_connections 1024;
    }

    stream {
        log_format proxy '$remote_addr [$time_local] '
                        '$protocol $status $bytes_sent $bytes_received '
                        '$session_time "upstream_addr" "$upstream_addr"';

        access_log /var/log/nginx/access.log proxy;

        upstream paperless_backend {
            server 100.115.249.19:8080;
        }

        server {
            listen 80;
            proxy_pass paperless_backend;
            proxy_connect_timeout 10s;
            proxy_timeout 300s;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless-tcp-proxy
  namespace: paperless-ngx
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: paperless-tcp-proxy
  template:
    metadata:
      labels:
        app: paperless-tcp-proxy
    spec:
      nodeSelector:
        node-type: cloud
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - paperless-tcp-proxy
                topologyKey: kubernetes.io/hostname
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
              hostPort: 80
              protocol: TCP
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
      volumes:
        - name: nginx-config
          configMap:
            name: paperless-proxy-config
---
apiVersion: v1
kind: Service
metadata:
  name: paperless-tcp-proxy
  namespace: paperless-ngx
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  selector:
    app: paperless-tcp-proxy
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
  type: ClusterIP
