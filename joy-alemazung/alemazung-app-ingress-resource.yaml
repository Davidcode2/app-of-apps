apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: alemazung-ingress
  namespace: joy-alemazung
  annotations:
    # We use a sync-wave to ensure this resource is only applied
    # *after* the service it depends on has been created by ArgoCD.
    argocd.argoproj.io/sync-wave: "1"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  # This tells the NGINX controller to manage this Ingress
  ingressClassName: nginx
  rules:
    - host: "alemazung.immo.jakob-lingel.dev"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: alemazung-app-service
                port:
                  # This must match the 'port' (not targetPort) from the Service
                  number: 80
    - host: "www.alemazung.immo.jakob-lingel.dev"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: alemazung-app-service
                port:
                  # This must match the 'port' (not targetPort) from the Service
                  number: 80
    - host: "alemazung.de"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: alemazung-app-service
                port:
                  number: 80
    - host: "www.alemazung.de"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: alemazung-app-service
                port:
                  # This must match the 'port' (not targetPort) from the Service
                  number: 80
  tls:
  - hosts:
      - "alemazung.immo.jakob-lingel.dev"
      - "www.alemazung.immo.jakob-lingel.dev"
      - "alemazung.de"
      - "www.alemazung.de"
    secretName: alemazung-tls
