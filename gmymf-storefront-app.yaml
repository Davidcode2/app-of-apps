apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gmymf-storefront
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Davidcode2/app-of-apps
    targetRevision: HEAD
    path: gmymf-storefront
  destination:
    server: https://kubernetes.default.svc
    namespace: gmymf-storefront
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
