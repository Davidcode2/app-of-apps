apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert
    kompose.version: 1.37.0 (HEAD)
    argocd.argoproj.io/sync-wave: "2"
  labels:
    io.kompose.service: immoly-app
    app: immoly-app
  name: immoly-app
  namespace: immoly
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: immoly-app
      app: immoly-app
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert
        kompose.version: 1.37.0 (HEAD)
      labels:
        io.kompose.service: immoly-app
        app: immoly-app
    spec:
      containers:
        - image: ghcr.io/davidcode2/immoly:0.1.0
          name: immoly-app
          envFrom:
            - configMapRef:
                name: env
            - secretRef:
                name: immoly-db-secret
      restartPolicy: Always
