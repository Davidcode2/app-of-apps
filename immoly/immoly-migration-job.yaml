apiVersion: batch/v1
kind: Job
metadata:
  name: immoly-migrate-db
  namespace: immoly
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
  labels:
    app: immoly-migrations
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: immoly-migrations
    spec:
      restartPolicy: Never
      containers:
      - name: migrate
        image: ghcr.io/davidcode2/immoly-migrations:latest
        command: ["npx", "drizzle-kit", "migrate"]
      - envFrom:
          - configMapRef:
              name: env
          - secretRef: 
              name: immoly-db-secret
