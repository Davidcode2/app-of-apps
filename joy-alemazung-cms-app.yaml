apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: joy-alemazung-cms
  namespace: argocd 
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/davidcode2/app-of-apps
    targetRevision: HEAD
    path: joy-alemazung-cms 
  destination:
    server: https://kubernetes.default.svc
    namespace: joy-alemazung
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
