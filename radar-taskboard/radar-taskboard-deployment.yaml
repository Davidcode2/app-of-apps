apiVersion: apps/v1
kind: Deployment
metadata:
  name: radar-taskboard
  namespace: radar-taskboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app: radar-taskboard
  template:
    metadata:
      labels:
        app: radar-taskboard
    spec:
      containers:
      - name: radar-taskboard
        image: ghcr.io/davidcode2/radar-taskboard:0.0.2
        ports:
        - containerPort: 8080
        resources:
          limits:
            memory: "128Mi"
            cpu: "100m"
          requests:
            memory: "64Mi"
            cpu: "50m"
