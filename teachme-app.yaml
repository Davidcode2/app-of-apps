apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: teachme
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/davidcode2/app-of-apps
    targetRevision: HEAD
    path: teachme
  destination:
    server: https://kubernetes.default.svc
    namespace: teachme
  syncPolicy:
    automated:
      # Keycloak will be adopted by another Application; never prune it here.
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
