apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert
    kompose.version: 1.37.0 (HEAD)
    argocd.argoproj.io/sync-wave: "2"
  labels:
    io.kompose.service: blog-app
    app: blog-app
  name: blog-app
  namespace: blog
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: blog-app
      app: blog-app
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert
        kompose.version: 1.37.0 (HEAD)
      labels:
        io.kompose.service: blog-app
        app: blog-app
    spec:
      containers:
        - image: ghcr.io/davidcode2/blog:1.0.1
          name: blog-app
      restartPolicy: Always
