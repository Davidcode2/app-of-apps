apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: teachme-keycloak-external-secret
  namespace: teachme
spec:
  refreshInterval: 6h

  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore

  target:
    name: teachme-keycloak-secret
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      type: Opaque
      data:
        # Keycloak admin credentials
        KEYCLOAK_ADMIN: "{{ .admin_username }}"
        KEYCLOAK_ADMIN_PASSWORD: "{{ .admin_password }}"
        KC_BOOTSTRAP_ADMIN_USERNAME: "{{ .admin_username }}"
        KC_BOOTSTRAP_ADMIN_PASSWORD: "{{ .admin_password }}"

        # Database credentials (must match keycloak-db secret)
        KC_DB_USERNAME: "{{ .db_username }}"
        KC_DB_PASSWORD: "{{ .db_password }}"

        # Keystore
        KEYSTORE_PASSWORD: "{{ .keystore_password }}"

        # Proxy setting
        KC_PROXY: "edge"

  data:
    - secretKey: admin_username
      remoteRef:
        key: /teachme/keycloak/admin_username
    - secretKey: admin_password
      remoteRef:
        key: /teachme/keycloak/admin_password
    - secretKey: db_username
      remoteRef:
        key: /teachme/keycloak/db_username
    - secretKey: db_password
      remoteRef:
        key: /teachme/keycloak/db_password
    - secretKey: keystore_password
      remoteRef:
        key: /teachme/keycloak/keystore_password
