apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: alemazung-strapi-external-secret
  namespace: joy-alemazung
spec:
  refreshInterval: 12h
  
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  
  # Target secret that will be created/updated in Kubernetes
  target:
    name: alemazung-strapi-secret
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      type: Opaque
      data:
        # Map the AWS Parameter Store keys to Kubernetes secret keys
        # External Secrets will handle base64 encoding
        NEXT_PUBLIC_PAGE_LIMIT: "6"
        STRAPI_API_TOKEN_PROD: "{{ .strapi_api_token }}"
        STRAPI_API_URL_PROD: "{{ .strapi_api_url }}"
  
  # Define which parameters to fetch from AWS Parameter Store
  data:
    - secretKey: strapi_api_token
      remoteRef:
        key: /joy_alemazung/strapi/api_token
    - secretKey: strapi_api_url
      remoteRef:
        key: /joy_alemazung/strapi/api_url
        
