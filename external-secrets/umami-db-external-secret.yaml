apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: umami-db-external-secret
  namespace: umami
spec:
  refreshInterval: 12h
  
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  
  # Target secret that will be created/updated in Kubernetes
  target:
    name: umami-db-secret
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      type: Opaque
      data:
        # External Secrets will handle base64 encoding
        POSTGRES_PASSWORD: "{{ .database_password }}"
        DATABASE_URL: "postgresql://umami:{{ .database_password }}@umami-db:5432/umami"
        APP_SECRET: "{{ .app_secret }}"
  
  # Define which parameters to fetch from AWS Parameter Store
  data:
    - secretKey: database_password
      remoteRef:
        key: /umami/db/password
    - secretKey: app_secret
      remoteRef:
        key: /umami/app_secret

