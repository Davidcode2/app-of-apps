apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hello-demo-ingress
  namespace: hello-demo
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  rules:
    - host: "jakob-lingel.dev"
      http:
        paths:
          - path: /demo/gkv
            pathType: Prefix
            backend:
              service:
                name: hello-demo-service
                port:
                  number: 80
