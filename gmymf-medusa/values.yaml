# Values for gmymf-medusa Medusa Backend deployment

nameOverride: "gmymf-medusa"
fullnameOverride: "gmymf-medusa"

medusa:
  image:
    repository: ghcr.io/davidcode2/medusa-backend
    tag: "0.0.1"
    pullPolicy: IfNotPresent

  replicas: 1

  service:
    type: ClusterIP
    port: 80
    targetPort: 9000

  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
      - host: gmymf-medusa.jakob-lingel.dev
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: gmymf-medusa-tls
        hosts:
          - gmymf-medusa.jakob-lingel.dev

  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"

  env:
    NODE_ENV: production
    PORT: "9000"
    STORE_CORS: "https://docs.medusajs.com"
    ADMIN_CORS: "https://docs.medusajs.com"
    AUTH_CORS: "https://docs.medusajs.com"

  migration:
    enabled: true
    resources:
      requests:
        memory: "256Mi"
        cpu: "250m"
      limits:
        memory: "512Mi"
        cpu: "500m"

  seed:
    enabled: false

postgres:
  enabled: true
  image:
    repository: postgres
    tag: "15-alpine"
    pullPolicy: IfNotPresent

  replicas: 1

  service:
    type: ClusterIP
    port: 5432

  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""

  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

  database: medusa_store
  user: postgres

redis:
  enabled: true
  image:
    repository: redis
    tag: "7-alpine"
    pullPolicy: IfNotPresent

  replicas: 1

  service:
    type: ClusterIP
    port: 6379

  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "100m"

externalSecrets:
  enabled: true
  secretStoreName: aws-parameter-store
  secretStoreKind: ClusterSecretStore
  refreshInterval: 6h
  parameters:
    jwtSecret: /gmymf-medusa/jwt/secret
    cookieSecret: /gmymf-medusa/cookie/secret
    postgresPassword: /gmymf-medusa/db/password

syncWaves:
  postgres: "0"
  redis: "0"
  secret: "1"
  migration: "2"
  medusa: "3"
  ingress: "4"
