apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert
    kompose.version: 1.37.0 (HEAD)
  labels:
    io.kompose.service: alemazung-strapi
  name: alemazung-strapi
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: alemazung-strapi
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert
        kompose.version: 1.37.0 (HEAD)
      labels:
        io.kompose.service: alemazung-strapi
    spec:
      containers:
        - envFrom:
            - configMapRef:
                name: env
          image: ghcr.io/davidcode2/alemazung_cms:latest
          name: schluesselmomente-cms
          ports:
            - containerPort: 1337
              protocol: TCP
          volumeMounts:
            - mountPath: /opt/app/config
              name: strapi-cm0
            - mountPath: /opt/package.json
              name: strapi-cm2
              subPath: package.json
            - mountPath: /opt/package-lock.json
              name: strapi-cm3
              subPath: package-lock.json
            - mountPath: /opt/app/.env
              name: strapi-secrets
              subPath: .env
            - mountPath: /opt/app/public/uploads
              name: strapi-uploads
      restartPolicy: Always
      volumes:
        - configMap:
            name: strapi-cm0
          name: strapi-cm0
        - configMap:
            items:
              - key: package.json
                path: package.json
            name: strapi-cm2
          name: strapi-cm2
        - configMap:
            items:
              - key: package-lock.json
                path: package-lock.json
            name: strapi-cm3
          name: strapi-cm3
        - name: strapi-secrets
          secret:
            secretName: strapi-secrets
            items:
              - key: .env
                path: .env
        - name: strapi-uploads
          persistentVolumeClaim:
            claimName: strapi-uploads-pvc
