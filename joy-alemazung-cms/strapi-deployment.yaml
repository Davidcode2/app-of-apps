apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert
    kompose.version: 1.37.0 (HEAD)
  labels:
    io.kompose.service: alemazung-strapi-app
  name: alemazung-strapi-app
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: alemazung-strapi-app
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert
        kompose.version: 1.37.0 (HEAD)
      labels:
        io.kompose.service: alemazung-strapi-app
    spec:
      containers:
        - envFrom:
            - secretRef:
                name: alemazung-strapi-app-secret
          image: ghcr.io/davidcode2/alemazung_cms:latest
          imagePullPolicy: Always
          name: schluesselmomente-cms
          ports:
            - containerPort: 1337
              protocol: TCP
          volumeMounts:
            - mountPath: /opt/app/config
              name: strapi-cm0
            - mountPath: /opt/package.json
              name: strapi-cm2
              subPath: package.json
            - mountPath: /opt/app/public/uploads
              name: strapi-uploads
      restartPolicy: Always
      volumes:
        - configMap:
            name: strapi-cm0
          name: strapi-cm0
        - configMap:
            items:
              - key: package.json
                path: package.json
            name: strapi-cm2
          name: strapi-cm2
        - name: strapi-uploads
          persistentVolumeClaim:
            claimName: strapi-uploads-pvc
