apiVersion: batch/v1
kind: Job
metadata:
  name: schreinerei-migration
  namespace: schreinerei
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: Force=true,Replace=true
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: schreinerei-migration
    spec:
      restartPolicy: Never
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          envFrom:
            - secretRef:
                name: schreinerei-db-secret
          command:
            - sh
            - -c
            - until pg_isready -h schreinerei-postgres-service -p 5432 -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do sleep 2; done
      containers:
        - name: migrate
          image: ghcr.io/davidcode2/schreinerei-backend:0.1.42
          command: ["schreinerei", "migrate"]
          envFrom:
            - configMapRef:
                name: schreinerei-backend-config
            - secretRef:
                name: schreinerei-db-secret
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
