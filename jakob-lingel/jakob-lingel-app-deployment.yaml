apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert
    kompose.version: 1.37.0 (HEAD)
    argocd.argoproj.io/sync-wave: "2"
  labels:
    io.kompose.service: jakob-lingel-app
    app: jakob-lingel-app
  name: jakob-lingel-app
  namespace: jakob-lingel
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: jakob-lingel-app
      app: jakob-lingel-app
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert
        kompose.version: 1.37.0 (HEAD)
      labels:
        io.kompose.service: jakob-lingel-app
        app: jakob-lingel-app
    spec:
      containers:
        - image: ghcr.io/davidcode2/jakob-lingel:1.0.1
          name: jakob-lingel-app
      restartPolicy: Always
