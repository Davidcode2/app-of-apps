apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gmymf-medusa
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Davidcode2/app-of-apps
    path: gmymf-medusa
    targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    namespace: gmymf-medusa
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
