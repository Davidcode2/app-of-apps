apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hetzner-ccm
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    # The CCM must run in the kube-system namespace
    namespace: kube-system
    server: https://kubernetes.default.svc
  source:
    repoURL: https://charts.hetzner.cloud
    chart: hcloud-cloud-controller-manager
    targetRevision: "1.31.1" # Current stable version
    helm:
      values: |
        env:
          HCLOUD_LOAD_BALANCERS_NETWORK_ZONE:
            value: eu-central
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # The CCM needs to be created in kube-system
      - CreateNamespace=false
