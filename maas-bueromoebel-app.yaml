apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: maas-bueromoebel
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Davidcode2/app-of-apps
    targetRevision: HEAD
    path: maas-bueromoebel
  destination:
    server: https://kubernetes.default.svc
    namespace: maas-bueromoebel
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
