apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/davidcode2/app-of-apps
    targetRevision: HEAD
    path: keycloak
  destination:
    server: https://kubernetes.default.svc
    # Reuse the existing namespace to preserve the bound database claim and TLS.
    namespace: teachme
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
