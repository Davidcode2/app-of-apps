apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: vacation-product-env
  namespace: vacation-product
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 6h
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  target:
    name: vacation-product-env
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      type: Opaque
      data:
        DATABASE_URL: "postgresql://{{ .db_user }}:{{ .db_password }}@vacation-product-postgres:5432/{{ .db_name }}"
        POSTGRES_DB: "{{ .db_name }}"
        POSTGRES_USER: "{{ .db_user }}"
        POSTGRES_PASSWORD: "{{ .db_password }}"
        PUBLIC_BASE_URL: "https://travel.jakob-lingel.dev"
        AUTH_MODE: "keycloak"
        KEYCLOAK_ISSUER: "https://auth.jakob-lingel.dev/realms/vacation"
        OIDC_CLIENT_ID: "vacation-web"
        OIDC_AUDIENCE: "vacation-api"
        PUBLISHED_ROOT: "/data/published"
  data:
    - secretKey: db_user
      remoteRef:
        key: /vacation-product/db/user
    - secretKey: db_password
      remoteRef:
        key: /vacation-product/db/password
    - secretKey: db_name
      remoteRef:
        key: /vacation-product/db/name
