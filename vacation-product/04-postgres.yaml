apiVersion: apps/v1
kind: Deployment
metadata:
  name: vacation-product-postgres
  namespace: vacation-product
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vacation-product-postgres
  template:
    metadata:
      labels:
        app: vacation-product-postgres
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16-alpine
          envFrom:
            - secretRef:
                name: vacation-product-env
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: vacation-product-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: vacation-product-postgres
  namespace: vacation-product
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  selector:
    app: vacation-product-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
