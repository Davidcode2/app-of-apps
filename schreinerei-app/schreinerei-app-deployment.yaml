apiVersion: apps/v1
kind: Deployment
metadata:
  name: schreinerei-app
  namespace: schreinerei-app
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app: schreinerei-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: schreinerei-app
  template:
    metadata:
      labels:
        app: schreinerei-app
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: schreinerei-app
          image: ghcr.io/davidcode2/schreinerei-landing-page:0.1.7
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
