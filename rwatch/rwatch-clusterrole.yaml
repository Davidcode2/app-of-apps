apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rwatch-agent
  labels:
    app: rwatch-agent
  annotations:
    argocd.argoproj.io/sync-wave: "1"
rules:
  # Required to read node and pod information
  - apiGroups: [""]
    resources: ["nodes", "pods"]
    verbs: ["get", "list", "watch"]
  # Required to access metrics from metrics-server
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
