apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rwatch-agent
  labels:
    app: rwatch-agent
  annotations:
    argocd.argoproj.io/sync-wave: "2"
subjects:
  - kind: ServiceAccount
    name: rwatch-agent
    namespace: rwatch
roleRef:
  kind: ClusterRole
  name: rwatch-agent
  apiGroup: rbac.authorization.k8s.io
