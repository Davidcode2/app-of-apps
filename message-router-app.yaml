apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: message-router
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Davidcode2/app-of-apps
    targetRevision: HEAD
    path: message-router
  destination:
    server: https://kubernetes.default.svc
    namespace: message-router
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
