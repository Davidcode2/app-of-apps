apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello-demo
  namespace: hello-demo
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Davidcode2/app-of-apps
    targetRevision: HEAD
    path: hello-demo
  destination:
    server: https://kubernetes.default.svc
    namespace: hello-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
